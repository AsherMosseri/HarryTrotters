name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Also started by redesign.yml, always on main.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy that has started always finishes; GitHub skips older queued ones
# and runs the newest next. (Cancelling in progress meant quick pushes in a
# row could cancel every deploy and leave the site on an old version.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build id is the commit that last changed the version log (vite.config.js).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The team's app, from main. (A redesign push starts this run on main too.)
      - run: npm run build
      # Asher's test copy of the redesign at …/next/ (src/next.js), built from
      # the redesign branch when there is one. Pushes to it start this run (redesign.yml).
      - name: Build the redesign test copy
        run: |
          if git ls-remote --exit-code --heads origin redesign > /dev/null; then
            git fetch --no-tags origin redesign
            git worktree add ../next FETCH_HEAD
            cd ../next
            npm ci
            GITHUB_SHA=$(git rev-parse HEAD) VITE_NEXT=1 npm run build
            cp -r dist "$GITHUB_WORKSPACE/dist/next"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
