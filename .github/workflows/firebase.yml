name: Deploy rules and notifications

# Publishes firestore.rules, storage.rules, and the notification functions to
# Firebase. One-time setup: scripts/setup-firebase-deploy.sh (see README).
on:
  push:
    branches: [main]
    paths: [firestore.rules, storage.rules, firebase.json, 'functions/**', 'scripts/keep-live-codes.mjs', .github/workflows/firebase.yml]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/779656354333/locations/global/workloadIdentityPools/github/providers/harrytrotters
          service_account: github-deploy@ftc-32313-tasks.iam.gserviceaccount.com
          token_format: access_token
      - name: Keep the live team codes
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/keep-live-codes.mjs
      - name: Find the database location
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl -sf -H "Authorization: Bearer $TOKEN" "https://firestore.googleapis.com/v1/projects/ftc-32313-tasks/databases/(default)" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s).locationId;console.log(l);require("fs").writeFileSync("functions/location.json",JSON.stringify({firestore:l}))})'
      # Scheduled functions need permission to set who may run them. Granted
      # here once (the setup script gives this account IAM admin for this).
      - name: Make sure the deploy account can set function permissions
        run: |
          SA=github-deploy@ftc-32313-tasks.iam.gserviceaccount.com
          added=
          for role in roles/run.admin roles/cloudfunctions.admin; do
            if ! gcloud projects get-iam-policy ftc-32313-tasks --flatten='bindings[].members' \
                --filter="bindings.role=$role AND bindings.members=serviceAccount:$SA" --format='value(bindings.role)' | grep -q .; then
              gcloud projects add-iam-policy-binding ftc-32313-tasks --member="serviceAccount:$SA" --role="$role" --condition=None --quiet >/dev/null
              added=1
            fi
          done
          # New permissions take a minute to apply.
          if [ -n "$added" ]; then sleep 90; fi
      - run: npm ci --prefix functions
      - run: npx -y firebase-tools@15.34.0 deploy --only firestore:rules,storage,functions --project ftc-32313-tasks --non-interactive --force
      - name: Check the morning reminder is scheduled
        run: |
          REGION=$(node -e 'const l=require("./functions/location.json").firestore;console.log({nam5:"us-central1",nam7:"us-central1",eur3:"europe-west1"}[l]||l)')
          gcloud scheduler jobs describe "firebase-schedule-dueTomorrow-$REGION" --location="$REGION" --format='value(schedule,timeZone,state)'
