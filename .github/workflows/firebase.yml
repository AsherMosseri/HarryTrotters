name: Deploy rules and notifications

# Publishes firestore.rules, storage.rules, and the notification functions to
# Firebase. One-time setup: scripts/setup-firebase-deploy.sh (see README).
on:
  push:
    branches: [main]
    paths: [firestore.rules, storage.rules, firebase.json, 'functions/**', 'scripts/keep-live-codes.mjs', .github/workflows/firebase.yml]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/779656354333/locations/global/workloadIdentityPools/github/providers/harrytrotters
          service_account: github-deploy@ftc-32313-tasks.iam.gserviceaccount.com
          token_format: access_token
      - name: Keep the live team codes
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/keep-live-codes.mjs
      - name: Find the database location
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl -sf -H "Authorization: Bearer $TOKEN" "https://firestore.googleapis.com/v1/projects/ftc-32313-tasks/databases/(default)" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s).locationId;console.log(l);require("fs").writeFileSync("functions/location.json",JSON.stringify({firestore:l}))})'
      # Scheduled functions need permission to set who may run them. Granted
      # here once (the setup script gives this account IAM admin for this).
      - name: Make sure the deploy account can set function permissions
        run: |
          SA=github-deploy@ftc-32313-tasks.iam.gserviceaccount.com
          added=
          for role in roles/run.admin roles/cloudfunctions.admin roles/secretmanager.admin; do
            if ! gcloud projects get-iam-policy ftc-32313-tasks --flatten='bindings[].members' \
                --filter="bindings.role=$role AND bindings.members=serviceAccount:$SA" --format='value(bindings.role)' | grep -q .; then
              gcloud projects add-iam-policy-binding ftc-32313-tasks --member="serviceAccount:$SA" --role="$role" --condition=None --quiet >/dev/null
              added=1
            fi
          done
          # New permissions take a minute to apply.
          if [ -n "$added" ]; then sleep 90; fi
      # The FTC Events API key for the match schedule (the ftcEvents function
      # reads it with defineSecret, and a deploy fails if those secrets don't
      # exist). When both GitHub secrets FTC_API_USER and FTC_API_KEY are set,
      # they're copied into Firebase's Secret Manager (a new version only when
      # the value changed, so versions don't pile up). Until then each secret
      # holds "unset", the deploy still works, and the site says the API isn't
      # set up. Values are never printed.
      - name: FTC Events API key
        env:
          FTC_API_USER: ${{ secrets.FTC_API_USER }}
          FTC_API_KEY: ${{ secrets.FTC_API_KEY }}
        run: |
          P=ftc-32313-tasks
          gcloud services enable secretmanager.googleapis.com --project "$P" --quiet
          both=
          if [ -n "$FTC_API_USER" ] && [ -n "$FTC_API_KEY" ]; then both=1; fi
          for name in FTC_API_USER FTC_API_KEY; do
            want=unset
            if [ -n "$both" ]; then want="${!name}"; fi
            if ! gcloud secrets describe "$name" --project "$P" >/dev/null 2>&1; then
              printf '%s' "$want" | gcloud secrets create "$name" --project "$P" --replication-policy=automatic --data-file=- --quiet >/dev/null
            elif [ -n "$both" ] && [ "$(gcloud secrets versions access latest --secret="$name" --project "$P")" != "$want" ]; then
              printf '%s' "$want" | gcloud secrets versions add "$name" --project "$P" --data-file=- --quiet >/dev/null
            fi
          done
      - run: npm ci --prefix functions
      # The functions first, then the rules. The rules only let in devices
      # signed in with a password, and only the account function signs them
      # in: if the rules went live first (one deploy publishes them before the
      # functions), nobody could get in for the minutes the functions take,
      # and a failed functions deploy would leave everyone locked out.
      - run: npx -y firebase-tools@15.34.0 deploy --only functions --project ftc-32313-tasks --non-interactive --force
      - run: npx -y firebase-tools@15.34.0 deploy --only firestore:rules,storage --project ftc-32313-tasks --non-interactive --force
      - name: Check the morning reminder and the queue alert are scheduled
        run: |
          REGION=$(node -e 'const l=require("./functions/location.json").firestore;console.log({nam5:"us-central1",nam7:"us-central1",eur3:"europe-west1"}[l]||l)')
          for job in dueTomorrow queueAlert; do
            gcloud scheduler jobs describe "firebase-schedule-$job-$REGION" --location="$REGION" --format='value(schedule,timeZone,state)'
          done
